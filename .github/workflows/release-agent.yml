name: Build & Release Agent

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/release-agent.yml"
    tags:
      - "agent-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-agent:
    name: Build Agent (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.26.0"
          cache-dependency-path: agent/go.sum

      - name: Compile agent binary
        working-directory: agent
        run: |
          if [[ "$GITHUB_REF" == refs/tags/agent-* ]]; then
            VERSION="${GITHUB_REF_NAME#agent-}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="custom-${GITHUB_SHA::7}"
          fi
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          fi
          mkdir -p dist
          CGO_ENABLED=0 \
          GOOS="${{ matrix.goos }}" \
          GOARCH="${{ matrix.goarch }}" \
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/nezhahq/agent/pkg/monitor.Version=${VERSION} -X main.arch=${{ matrix.goarch }}" \
            -o "dist/nezha-agent${EXT}" \
            ./cmd/agent
          zip -j "dist/nezha-agent_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "dist/nezha-agent${EXT}"

      - name: Upload agent archive
        uses: actions/upload-artifact@v7
        with:
          name: nezha-agent_${{ matrix.goos }}_${{ matrix.goarch }}
          path: agent/dist/nezha-agent_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release-agent:
    name: Publish Agent Release
    needs: build-agent
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download agent archives
        uses: actions/download-artifact@v8
        with:
          pattern: nezha-agent_*
          merge-multiple: true
          path: agent-release

      - name: Generate checksums
        working-directory: agent-release
        run: sha256sum *.zip > agent-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            agent-release/*.zip
            agent-release/agent-checksums.txt
          generate_release_notes: true
