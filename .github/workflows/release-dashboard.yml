name: Build & Release Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "frontend-user/**"
      - "frontend-admin/**"
      - "scripts/**"
      - ".github/workflows/release-dashboard.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontends:
    name: Build Frontends (User & Admin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.5.1"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build frontend-user
        working-directory: frontend-user
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build frontend-admin
        working-directory: frontend-admin
        run: |
          npm ci
          npm run build-ignore-error

      - name: Upload user-dist
        uses: actions/upload-artifact@v7
        with:
          name: user-dist
          path: frontend-user/dist/
          include-hidden-files: true

      - name: Upload admin-dist
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: frontend-admin/dist/
          include-hidden-files: true

  build-dashboard:
    name: Build Dashboard (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build-frontends
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.26
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: x86_64-linux-gnu-gcc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip curl
          wget -q https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64 -O /usr/bin/yq
          echo "129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973  /usr/bin/yq" | sha256sum -c -
          chmod +x /usr/bin/yq

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built user-dist
        uses: actions/download-artifact@v8
        with:
          name: user-dist
          path: dashboard/cmd/dashboard/user-dist

      - name: Download built admin-dist
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: dashboard/cmd/dashboard/admin-dist

      - name: Verify local frontend builds & fetch extra community themes
        run: |
          test -f dashboard/cmd/dashboard/user-dist/index.html
          test -f dashboard/cmd/dashboard/admin-dist/index.html
          bash scripts/prepare-frontends.sh --community-only

      - name: Fetch IPInfo GeoIP Database (optional)
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ -n "${IPINFO_TOKEN:-}" ]; then
            echo "Downloading IPInfo GeoIP database..."
            curl -fsSL "https://ipinfo.io/data/free/country.mmdb?token=${IPINFO_TOKEN}" -o dashboard/pkg/geoip/geoip.db
          else
            echo "::notice::IPINFO_TOKEN secret not configured; building with placeholder geoip.db. Add IPINFO_TOKEN in repository Secrets to enable GeoIP flags."
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.26.6"
          cache-dependency-path: dashboard/go.sum

      - name: Generate swagger docs
        working-directory: dashboard
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs
          go mod tidy

      - name: Compile dashboard binary
        working-directory: dashboard
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="custom-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          CGO_ENABLED=1 \
          CC="${{ matrix.cc }}" \
          GOOS="${{ matrix.goos }}" \
          GOARCH="${{ matrix.goarch }}" \
          go build \
            -trimpath \
            -buildvcs=false \
            -tags go_json \
            -ldflags "-s -w -X github.com/nezhahq/nezha/service/singleton.Version=${VERSION} -extldflags '-static -fpic'" \
            -o "dist/dashboard-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/dashboard
          ls -lh "dist/dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload dashboard binary
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dashboard/dist/dashboard-${{ matrix.goos }}-${{ matrix.goarch }}

  release-docker:
    name: Build & Push Docker Image (GHCR)
    needs: build-dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download dashboard binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-*
          merge-multiple: true
          path: dashboard/dist

      - name: Fix binary permissions
        run: |
          chmod +x dashboard/dist/dashboard-*
          ls -lh dashboard/dist/

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_NAME="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${GITHUB_REF_NAME}"
          else
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${GITHUB_REF_NAME},${IMAGE_NAME}:sha-${SHORT_SHA}"
          fi
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release-binaries:
    name: Publish GitHub Release
    needs: build-dashboard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dashboard binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-*
          merge-multiple: true
          path: release-bin

      - name: Archive binaries & checksums
        working-directory: release-bin
        run: |
          chmod +x dashboard-*
          for f in dashboard-*; do
            zip -q "${f}.zip" "$f"
          done
          sha256sum *.zip > dashboard-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-bin/*.zip
            release-bin/dashboard-checksums.txt
          generate_release_notes: true
